<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="build" content="20261016103941">
<title>Yard · MECHAFOLIO</title>
<meta name="description" content="Every MECHAFOLIO pilot's mech standing in one yard, sized by their share of $FOLIO. Rankings by frame class.">
<meta name="theme-color" content="#0B1220">
<meta property="og:title" content="Yard · MECHAFOLIO"><meta property="og:image" content="https://mechafolio.xyz/assets/art/og.jpg"><meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/brand/mark.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css?v=20261016103941"><link rel="stylesheet" href="css/landing.css?v=20261016103941"><link rel="stylesheet" href="css/app.css?v=20261016103941"><link rel="stylesheet" href="css/yard.css?v=20261016103941">
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }</script>
</head>
<body class="app yard" data-theme="cockpit">
<canvas id="stage" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>
<div class="labels" id="labels" aria-hidden="true"></div>

<main class="yd">
  <section class="intro">
    <p class="kicker">The Yard</p>
    <h1>Every pilot, standing.</h1>
    <p class="dim" id="ydCount">Loading the yard…</p>
  </section>

  <section class="hud board">
    <div class="panel-h"><h2>Rankings</h2><form id="find" class="find"><input class="input" id="findIn" placeholder="Find 0x…" spellcheck="false" autocomplete="off"></form></div>
    <div class="cls-tabs" id="clsTabs"></div>
    <div class="scroll"><table class="grid" id="rank"><thead><tr><th>#</th><th>Pilot</th><th>Class</th><th class="r">Share</th><th class="r">Streak</th><th class="r">W–L</th></tr></thead><tbody></tbody></table></div>
  </section>

  <div class="card hud" id="card" hidden>
    <div class="panel-h"><h3 class="mono" id="cdAddr">—</h3><span class="tag-pill" id="cdCls">—</span></div>
    <div class="panel-b">
      <div class="kv">
        <span class="k">Rank</span><span class="v mono" id="cdRank">—</span>
        <span class="k">Share</span><span class="v mono" id="cdShare">—</span>
        <span class="k">Height</span><span class="v mono" id="cdH">—</span>
        <span class="k">Last duel</span><span class="v mono" id="cdRec">—</span>
      </div>
      <div class="cd-load" id="cdLoad"></div>
      <a class="btn btn-accent btn-sm" id="cdGo" href="#">Open hangar</a>
    </div>
  </div>
</main>

<script type="module" src="js/livewatch.js?v=20261016103941"></script>
<script type="module" src="js/yard.js?v=20261016103941"></script>
</body>
</html>
